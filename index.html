<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Guía Metodológica</title>
<style>
  :root{
    --azul-principal:#02244F;
    --azul-secundario:#0E408B;
    --naranja:#F05A12;
    --dorado:#F7A307;
    --blanco:#FFFFFF;
    --gris-suave:#F4F6F9;
    --texto:#1B2530;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--gris-suave);
    color:var(--texto);
  }
  .app{
    max-width:960px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .topbar{
    background:linear-gradient(135deg,var(--azul-principal) 0%,var(--azul-secundario) 100%);
    border-radius:14px;
    padding:22px 26px;
    color:var(--blanco);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    box-shadow:0 6px 18px rgba(2,36,79,0.25);
  }
  .topbar h1{
    margin:0;
    font-size:20px;
    letter-spacing:.2px;
  }
  .topbar p{
    margin:4px 0 0;
    font-size:13px;
    color:#CFE0F5;
  }
  .badge{
    background:var(--dorado);
    color:var(--azul-principal);
    font-weight:700;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  .steps{
    display:flex;
    gap:8px;
    margin:22px 0;
  }
  .step-dot{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    background:var(--blanco);
    border:2px solid #E1E6EE;
    font-size:12px;
    font-weight:600;
    color:#8B96A5;
    cursor:pointer;
    transition:all .2s ease;
  }
  .step-dot.active{
    border-color:var(--azul-secundario);
    color:var(--azul-principal);
    background:#EAF1FB;
  }
  .step-dot.done{
    border-color:var(--dorado);
    color:var(--azul-principal);
    background:#FFF6E4;
  }

  .card{
    background:var(--blanco);
    border-radius:14px;
    padding:28px;
    box-shadow:0 2px 12px rgba(2,36,79,0.08);
    border-top:5px solid var(--naranja);
  }
  .card h2{
    margin-top:0;
    color:var(--azul-principal);
    font-size:19px;
    border-bottom:2px solid #EEF1F5;
    padding-bottom:12px;
  }
  .card h2 span{
    color:var(--naranja);
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media(max-width:640px){
    .grid2{grid-template-columns:1fr;}
    .topbar{flex-direction:column;align-items:flex-start;}
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--azul-principal);
    margin-bottom:6px;
    margin-top:14px;
  }
  input[type=text], input[type=password], input[type=email], textarea, select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #D8DEE7;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    color:var(--texto);
    background:var(--blanco);
    transition:border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--azul-secundario);
    box-shadow:0 0 0 3px rgba(14,64,139,0.12);
  }
  textarea{resize:vertical; min-height:100px;}
  .hint{
    font-size:12px;
    color:#7A8697;
    margin-top:4px;
  }
  .required::after{
    content:" *";
    color:var(--naranja);
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
    gap:12px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:9px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:.55; cursor:not-allowed;}
  .btn-primary{
    background:var(--naranja);
    color:var(--blanco);
    box-shadow:0 4px 10px rgba(240,90,18,0.3);
  }
  .btn-primary:hover:not(:disabled){box-shadow:0 6px 14px rgba(240,90,18,0.4);}
  .btn-secondary{
    background:var(--blanco);
    color:var(--azul-secundario);
    border:1.5px solid var(--azul-secundario);
  }
  .btn-gold{
    background:var(--dorado);
    color:var(--azul-principal);
  }
  .btn-outline{
    background:transparent;
    border:1.5px solid #D8DEE7;
    color:var(--texto);
  }

  .loading-wrap{
    text-align:center;
    padding:60px 20px;
  }
  .spinner{
    width:52px;height:52px;
    margin:0 auto 20px;
    border:5px solid #E1E6EE;
    border-top-color:var(--naranja);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{
    color:var(--azul-principal);
    font-weight:600;
    font-size:14.5px;
  }

  .error-box{
    background:#FDEDEA;
    border:1.5px solid var(--naranja);
    color:#8A2E0C;
    padding:14px 16px;
    border-radius:9px;
    font-size:13.5px;
    margin-top:16px;
  }

  .upload-box{
    border:1.5px dashed #B9C4D4;
    border-radius:10px;
    padding:16px;
    margin-top:8px;
    background:#FAFBFD;
  }
  .upload-box input[type=file]{
    font-size:13px;
  }
  .upload-status{
    margin-top:12px;
    font-size:13px;
  }
  .upload-status.ready{
    background:#EAF7EE;
    border:1px solid #8FCB9E;
    color:#1E6B34;
    padding:10px 12px;
    border-radius:8px;
  }
  .upload-status.loading{
    color:var(--azul-secundario);
    font-weight:600;
  }
  .upload-preview{
    margin-top:8px;
    font-size:12px;
    color:#5B6B80;
    background:var(--blanco);
    border:1px solid #E1E6EE;
    border-radius:6px;
    padding:8px 10px;
    max-height:110px;
    overflow:auto;
    white-space:pre-wrap;
  }
  .divider-or{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0 4px;
    color:#9AA6B5;
    font-size:12px;
    font-weight:700;
  }
  .divider-or::before, .divider-or::after{
    content:'';
    flex:1;
    height:1px;
    background:#E1E6EE;
  }

  /* Preview / documento generado */
  .doc-wrap{
    background:var(--blanco);
    border-radius:14px;
    box-shadow:0 2px 12px rgba(2,36,79,0.08);
    overflow:hidden;
  }
  .doc-header{
    background:var(--azul-principal);
    color:var(--blanco);
    padding:26px 30px;
    text-align:center;
  }
  .doc-header h2{
    margin:0 0 4px;
    font-size:16px;
    letter-spacing:.3px;
  }
  .doc-header h3{
    margin:2px 0;
    font-size:12.5px;
    font-weight:500;
    color:#CFE0F5;
  }
  .doc-header .titulo-guia{
    margin-top:14px;
    font-size:20px;
    font-weight:800;
    color:var(--dorado);
    letter-spacing:.5px;
  }
  .doc-body{padding:26px 30px 36px;}
  .doc-section{margin-top:30px;}
  .doc-section h4{
    color:var(--blanco);
    background:var(--azul-secundario);
    display:inline-block;
    padding:6px 14px;
    border-radius:6px;
    font-size:13.5px;
    margin:0 0 12px;
  }
  .doc-section .accent-bar{
    height:3px;
    width:46px;
    background:var(--naranja);
    border-radius:3px;
    margin-bottom:14px;
  }
  .doc-section p{
    font-size:13.8px;
    line-height:1.65;
    color:#2B384A;
    white-space:pre-wrap;
  }
  .doc-list{
    margin:6px 0 0 22px;
    padding:0;
    font-size:13.8px;
    line-height:1.65;
    color:#2B384A;
  }
  .doc-list li{
    margin-bottom:6px;
  }
  table.doc-table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    font-size:12.8px;
  }
  table.doc-table th{
    background:var(--azul-secundario);
    color:var(--blanco);
    padding:9px 10px;
    text-align:left;
    border:1px solid var(--azul-principal);
  }
  table.doc-table td{
    padding:9px 10px;
    border:1px solid #E1E6EE;
    vertical-align:top;
    color:#2B384A;
  }
  table.doc-table tr:nth-child(even) td{background:#F3F7FC;}
  table.identif td{
    border:1px solid #E1E6EE;
    padding:8px 10px;
  }
  table.identif td.label{
    background:#EAF1FB;
    font-weight:700;
    color:var(--azul-principal);
    width:34%;
  }
  .pill{
    display:inline-block;
    background:var(--dorado);
    color:var(--azul-principal);
    font-weight:700;
    font-size:11px;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .doc-footer{
    text-align:center;
    padding:18px;
    font-size:11.5px;
    color:#8B96A5;
    border-top:1px solid #EEF1F5;
  }

  .export-bar{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:18px 0 0;
  }

  @media print{
    body{background:#fff;}
    .app{max-width:100%;padding:0;}
    .topbar, .steps, .export-bar, .no-print{display:none !important;}
    .doc-wrap{box-shadow:none;}
  }
</style>
<!-- Bibliotecas CDN oficiales para lectura de DOCX y extracción PDF sin romper el DOM -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>Generador de Guía Metodológica</h1>
      <p>UPNFM · Programa de Educación Virtual</p>
    </div>
    <div class="badge" id="stepBadge">Paso 1 de 4</div>
  </div>

  <div class="steps no-print" id="stepsNav"></div>

  <div id="content"></div>

</div>

<script>
// Estado de la Aplicación
const state = {
  step: 1,
  loading: false,
  loadingMsg: '',
  error: null,
  config: {
    provider: localStorage.getItem('gm_provider') || 'anthropic',
    apiKey: localStorage.getItem('gm_apiKey') || '',
    model: localStorage.getItem('gm_model') || 'claude-3-5-sonnet-20241022',
    baseUrl: localStorage.getItem('gm_baseUrl') || 'https://api.openai.com/v1'
  },
  doc: {
    asignatura: '',
    codigo: '',
    periodo: '',
    facultad: 'Facultad de Ciencia y Tecnología',
    departamento: 'Educación Técnico Industrial',
    modalidad: 'Virtual',
    creditos: '3',
    docente: '',
    emailDocente: '',
    presentacion: '',
    competencias: '',
    metodologia: '',
    evaluacion: '',
    semanas: 14,
    textoAnalizado: '',
    archivoNombre: ''
  },
  guiaGenerada: null
};

const stepsNames = [
  '1. Configuración e IA',
  '2. Datos de Asignatura',
  '3. Sílabo y Planificación',
  '4. Guía Metodológica'
];

function init(){
  renderSteps();
  renderContent();
}

function renderSteps(){
  const nav = document.getElementById('stepsNav');
  const badge = document.getElementById('stepBadge');
  badge.textContent = `Paso ${state.step} de 4`;
  nav.innerHTML = '';
  
  stepsNames.forEach((name, idx) => {
    const num = idx + 1;
    const dot = document.createElement('div');
    dot.className = `step-dot ${state.step === num ? 'active' : ''} ${state.step > num ? 'done' : ''}`;
    dot.textContent = name;
    dot.onclick = () => {
      if(state.loading) return;
      if(num < state.step || validarPasoActual(state.step)){
        state.step = num;
        state.error = null;
        renderSteps();
        renderContent();
      }
    };
    nav.appendChild(dot);
  });
}

function validarPasoActual(step){
  if(step === 1){
    return !!state.config.apiKey;
  }
  if(step === 2){
    return !!state.doc.asignatura;
  }
  return true;
}

function renderContent(){
  const container = document.getElementById('content');
  container.innerHTML = '';

  if(state.loading){
    container.innerHTML = `
      <div class="card">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <div class="loading-msg">${state.loadingMsg || 'Generando información pedagógica...'}</div>
          <p class="hint" style="margin-top:10px;">El modelo seleccionado (${state.config.model}) está procesando el guion instruccional.</p>
        </div>
      </div>
    `;
    return;
  }

  if(state.error){
    const errBox = document.createElement('div');
    errBox.className = 'error-box';
    errBox.innerHTML = `<strong>Error:</strong> ${state.error}`;
    container.appendChild(errBox);
  }

  if(state.step === 1) renderStep1(container);
  else if(state.step === 2) renderStep2(container);
  else if(state.step === 3) renderStep3(container);
  else if(state.step === 4) renderStep4(container);
}

// Paso 1: Configuración Universal de IA
function renderStep1(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Paso 1: Configuración de la <span>Inteligencia Artificial</span></h2>
    <p class="hint">Selecciona tu proveedor preferido e ingresa la API Key correspondiente. Los datos se almacenan de forma local en tu navegador.</p>
    
    <label class="required">Proveedor de IA</label>
    <select id="selProvider" onchange="cambiarProveedor(this.value)">
      <option value="anthropic" ${state.config.provider === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option>
      <option value="openai" ${state.config.provider === 'openai' ? 'selected' : ''}>OpenAI (ChatGPT)</option>
      <option value="gemini" ${state.config.provider === 'gemini' ? 'selected' : ''}>Google Gemini</option>
      <option value="compatible" ${state.config.provider === 'compatible' ? 'selected' : ''}>Compatible OpenAI (DeepSeek, Groq, OpenRouter, LocalAI)</option>
    </select>

    <div id="boxBaseUrl" style="display: ${state.config.provider === 'compatible' ? 'block' : 'none'};">
      <label class="required">Base URL del Proveedor</label>
      <input type="text" id="txtBaseUrl" value="${state.config.baseUrl}" placeholder="Ej: https://api.deepseek.com/v1">
      <div class="hint">Endpoint compatible con /chat/completions</div>
    </div>

    <label class="required">Modelo de IA</label>
    <input type="text" id="txtModel" value="${state.config.model}" placeholder="Modelo">
    <div class="hint" id="lblModelHint">Sugerencias: claude-3-5-sonnet-20241022, claude-3-haiku-20240307</div>

    <label class="required">API Key</label>
    <input type="password" id="txtApiKey" value="${state.config.apiKey}" placeholder="sk-...">
    <div class="hint">Tu clave permanece segura en tu sesión local.</div>

    <div class="nav-row">
      <div></div>
      <button class="btn-primary" onclick="guardarPaso1()">Continuar a Datos de Asignatura →</button>
    </div>
  `;
  container.appendChild(card);
}

function cambiarProveedor(prov){
  state.config.provider = prov;
  const baseUrlBox = document.getElementById('boxBaseUrl');
  const txtModel = document.getElementById('txtModel');
  const lblHint = document.getElementById('lblModelHint');

  if(prov === 'anthropic'){
    baseUrlBox.style.display = 'none';
    txtModel.value = 'claude-3-5-sonnet-20241022';
    lblHint.textContent = 'Sugerencias: claude-3-5-sonnet-20241022, claude-3-haiku-20240307';
  } else if(prov === 'openai'){
    baseUrlBox.style.display = 'none';
    txtModel.value = 'gpt-4o';
    lblHint.textContent = 'Sugerencias: gpt-4o, gpt-4o-mini';
  } else if(prov === 'gemini'){
    baseUrlBox.style.display = 'none';
    txtModel.value = 'gemini-1.5-pro';
    lblHint.textContent = 'Sugerencias: gemini-1.5-pro, gemini-1.5-flash';
  } else if(prov === 'compatible'){
    baseUrlBox.style.display = 'block';
    txtModel.value = 'deepseek-chat';
    lblHint.textContent = 'Sugerencias: deepseek-chat, llama-3.1-70b-versatile, mistral-large';
  }
}

function guardarPaso1(){
  const apiKey = document.getElementById('txtApiKey').value.trim();
  const model = document.getElementById('txtModel').value.trim();
  const provider = document.getElementById('selProvider').value;
  const baseUrl = document.getElementById('txtBaseUrl') ? document.getElementById('txtBaseUrl').value.trim() : '';

  if(!apiKey){
    state.error = 'Por favor ingresa la API Key para continuar.';
    renderContent();
    return;
  }

  state.config.provider = provider;
  state.config.apiKey = apiKey;
  state.config.model = model;
  state.config.baseUrl = baseUrl;

  localStorage.setItem('gm_provider', provider);
  localStorage.setItem('gm_apiKey', apiKey);
  localStorage.setItem('gm_model', model);
  localStorage.setItem('gm_baseUrl', baseUrl);

  state.error = null;
  state.step = 2;
  renderSteps();
  renderContent();
}

// Paso 2: Datos de Asignatura
function renderStep2(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Paso 2: Datos Generales del <span>Espacio Pedagógico</span></h2>
    
    <div class="grid2">
      <div>
        <label class="required">Nombre del Espacio / Asignatura</label>
        <input type="text" id="fAsignatura" value="${state.doc.asignatura}" placeholder="Ej: Metodología de la Investigación Educativa">
      </div>
      <div>
        <label>Código de Asignatura</label>
        <input type="text" id="fCodigo" value="${state.doc.codigo}" placeholder="Ej: FPM-101">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Período Académico</label>
        <input type="text" id="fPeriodo" value="${state.doc.periodo}" placeholder="Ej: II Período 2026">
      </div>
      <div>
        <label>Modalidad de Entrega</label>
        <select id="fModalidad">
          <option value="Virtual" ${state.doc.modalidad === 'Virtual' ? 'selected' : ''}>Virtual</option>
          <option value="Híbrida / B-Learning" ${state.doc.modalidad === 'Híbrida / B-Learning' ? 'selected' : ''}>Híbrida / B-Learning</option>
          <option value="A Distancia" ${state.doc.modalidad === 'A Distancia' ? 'selected' : ''}>A Distancia</option>
        </select>
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Facultad</label>
        <input type="text" id="fFacultad" value="${state.doc.facultad}">
      </div>
      <div>
        <label>Departamento Académico</label>
        <input type="text" id="fDepartamento" value="${state.doc.departamento}">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Nombre del Docente / Diseñador</label>
        <input type="text" id="fDocente" value="${state.doc.docente}" placeholder="Ej: Máster Juan Pérez">
      </div>
      <div>
        <label>Correo Electrónico Institucional</label>
        <input type="email" id="fEmail" value="${state.doc.emailDocente}" placeholder="ejemplo@upnfm.edu.hn">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Unidades Valorativas / Créditos</label>
        <input type="text" id="fCreditos" value="${state.doc.creditos}">
      </div>
      <div>
        <label>Duración en Semanas</label>
        <input type="text" id="fSemanas" value="${state.doc.semanas}">
      </div>
    </div>

    <div class="nav-row">
      <button class="btn-secondary" onclick="state.step=1; renderSteps(); renderContent();">← Paso Anterior</button>
      <button class="btn-primary" onclick="guardarPaso2()">Continuar a Sílabo / Insumos →</button>
    </div>
  `;
  container.appendChild(card);
}

function guardarPaso2(){
  const asig = document.getElementById('fAsignatura').value.trim();
  if(!asig){
    state.error = 'El nombre del espacio pedagógico es obligatorio.';
    renderContent();
    return;
  }
  state.doc.asignatura = asig;
  state.doc.codigo = document.getElementById('fCodigo').value.trim();
  state.doc.periodo = document.getElementById('fPeriodo').value.trim();
  state.doc.modalidad = document.getElementById('fModalidad').value;
  state.doc.facultad = document.getElementById('fFacultad').value.trim();
  state.doc.departamento = document.getElementById('fDepartamento').value.trim();
  state.doc.docente = document.getElementById('fDocente').value.trim();
  state.doc.emailDocente = document.getElementById('fEmail').value.trim();
  state.doc.creditos = document.getElementById('fCreditos').value.trim();
  state.doc.semanas = document.getElementById('fSemanas').value.trim();

  state.error = null;
  state.step = 3;
  renderSteps();
  renderContent();
}

// Paso 3: Insumos, Carga de Archivo y Planificación
function renderStep3(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Paso 3: Carga de <span>Sílabo / Planificación Didáctica</span></h2>
    <p class="hint">Carga el programa de la asignatura en Word (.docx) o PDF para que la IA extraiga los contenidos, o redacta/pega los lineamientos clave.</p>

    <div class="upload-box">
      <label style="margin-top:0;">Subir archivo de sílabo o planificación (.docx / .pdf)</label>

// Extracción de texto desde DOCX y PDF en el cliente
async function procesarArchivo(input){
  const file = input.files[0];
  if(!file) return;

  const statusEl = document.getElementById('uploadStatus');
  const previewEl = document.getElementById('uploadPreview');

  statusEl.style.display = 'block';
  statusEl.className = 'upload-status loading';
  statusEl.textContent = `Procesando "${file.name}"...`;
  previewEl.style.display = 'none';

  try{
    let texto = '';
    if(file.name.toLowerCase().endsWith('.docx')){
      if(!window.mammoth) throw new Error("Librería Mammoth no disponible.");
      const arrayBuffer = await file.arrayBuffer();
      const res = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
      texto = res.value;
    } else if(file.name.toLowerCase().endsWith('.pdf')){
      if(!window.pdfjsLib) throw new Error("Librería PDF.js no disponible.");
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let paginasTexto = [];
      for(let i = 1; i <= pdf.numPages; i++){
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const str = textContent.items.map(item => item.str).join(' ');
        paginasTexto.push(str);
      }
      texto = paginasTexto.join('\n\n');
    } else {
      throw new Error("Formato no compatible. Por favor sube un archivo .docx o .pdf");
    }

    state.doc.textoAnalizado = texto;
    state.doc.archivoNombre = file.name;

    statusEl.className = 'upload-status ready';
    statusEl.textContent = `✓ Archivo "${file.name}" cargado exitosamente (${texto.length} caracteres leídos).`;
    previewEl.style.display = 'block';
    previewEl.textContent = texto.substring(0, 500) + (texto.length > 500 ? '...\n[Texto truncado para vista previa]' : '');

    // Autocompletar campos si están vacíos con un extracto
    if(!document.getElementById('fPresentacion').value){
      document.getElementById('fPresentacion').value = `Información extraída del archivo adjunto ${file.name}.`;
    }
  }catch(e){
    statusEl.className = 'upload-status';
    statusEl.style.color = '#8A2E0C';
    statusEl.textContent = `Error al procesar archivo: ${e.message}`;
  }
}

// CAPA UNIVERSAL DE LLAMADAS IA
async function ejecutarLlamadaIA(prompt, systemMsg){
  const { provider, apiKey, model, baseUrl } = state.config;

  if(provider === 'anthropic'){
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model || 'claude-3-5-sonnet-20241022',
        max_tokens: 4000,
        system: systemMsg,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `Error ${resp.status} en Anthropic API`);
    }
    const data = await resp.json();
    return data.content[0].text;
  }

  if(provider === 'openai' || provider === 'compatible'){
    const endpoint = provider === 'openai' 
      ? 'https://api.openai.com/v1/chat/completions' 
      : `${baseUrl.replace(/\/$/, '')}/chat/completions`;

    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model || 'gpt-4o',
        messages: [
          { role: 'system', content: systemMsg },
          { role: 'user', content: prompt }
        ],
        temperature: 0.7
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `Error ${resp.status} en API`);
    }
    const data = await resp.json();
    return data.choices[0].message.content;
  }

  if(provider === 'gemini'){
    const cleanModel = model || 'gemini-1.5-pro';
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${apiKey}`;
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: systemMsg }] },
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 4000 }
      })
    });
    if(!resp.ok){
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `Error ${resp.status} en Gemini API`);
    }
    const data = await resp.json();
    return data.candidates[0].content.parts[0].text;
  }

  throw new Error("Proveedor de Inteligencia Artificial no soportado.");
}

function limpiarYParsearJSON(texto){
  let t = texto.trim();
  if(t.startsWith("```")){
    t = t.replace(/^```[a-z]*\n/i, "").replace(/```$/g, "").trim();
  }
  return JSON.parse(t);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
