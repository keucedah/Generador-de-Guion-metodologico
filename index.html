<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Guía Metodológica - UPNFM</title>
<style>
  :root{
    --azul-principal:#02244F;
    --azul-secundario:#0E408B;
    --naranja:#F05A12;
    --dorado:#F7A307;
    --blanco:#FFFFFF;
    --gris-suave:#F4F6F9;
    --texto:#1B2530;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--gris-suave);
    color:var(--texto);
  }
  .app{
    max-width:960px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .topbar{
    background:linear-gradient(135deg,var(--azul-principal) 0%,var(--azul-secundario) 100%);
    border-radius:14px;
    padding:22px 26px;
    color:var(--blanco);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    box-shadow:0 6px 18px rgba(2,36,79,0.25);
  }
  .topbar h1{
    margin:0;
    font-size:20px;
    letter-spacing:.2px;
  }
  .topbar p{
    margin:4px 0 0;
    font-size:13px;
    color:#CFE0F5;
  }
  .badge{
    background:var(--dorado);
    color:var(--azul-principal);
    font-weight:700;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  .steps{
    display:flex;
    gap:8px;
    margin:22px 0;
  }
  .step-dot{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    background:var(--blanco);
    border:2px solid #E1E6EE;
    font-size:12px;
    font-weight:600;
    color:#8B96A5;
    cursor:pointer;
    transition:all .2s ease;
  }
  .step-dot.active{
    border-color:var(--azul-secundario);
    color:var(--azul-principal);
    background:#EAF1FB;
  }
  .step-dot.done{
    border-color:var(--dorado);
    color:var(--azul-principal);
    background:#FFF6E4;
  }

  .card{
    background:var(--blanco);
    border-radius:14px;
    padding:28px;
    box-shadow:0 2px 12px rgba(2,36,79,0.08);
    border-top:5px solid var(--naranja);
  }
  .card h2{
    margin-top:0;
    color:var(--azul-principal);
    font-size:19px;
    border-bottom:2px solid #EEF1F5;
    padding-bottom:12px;
  }
  .card h2 span{
    color:var(--naranja);
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media(max-width:640px){
    .grid2{grid-template-columns:1fr;}
    .topbar{flex-direction:column;align-items:flex-start;}
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--azul-principal);
    margin-bottom:6px;
    margin-top:14px;
  }
  input[type=text], input[type=password], input[type=email], textarea, select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #D8DEE7;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    color:var(--texto);
    background:var(--blanco);
    transition:border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--azul-secundario);
    box-shadow:0 0 0 3px rgba(14,64,139,0.12);
  }
  textarea{resize:vertical; min-height:100px;}
  .hint{
    font-size:12px;
    color:#7A8697;
    margin-top:4px;
  }
  .required::after{
    content:" *";
    color:var(--naranja);
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
    gap:12px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:9px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:.55; cursor:not-allowed;}
  .btn-primary{
    background:var(--naranja);
    color:var(--blanco);
    box-shadow:0 4px 10px rgba(240,90,18,0.3);
  }
  .btn-primary:hover:not(:disabled){box-shadow:0 6px 14px rgba(240,90,18,0.4);}
  .btn-secondary{
    background:var(--blanco);
    color:var(--azul-secundario);
    border:1.5px solid var(--azul-secundario);
  }
  .btn-gold{
    background:var(--dorado);
    color:var(--azul-principal);
  }
  .btn-outline{
    background:transparent;
    border:1.5px solid #D8DEE7;
    color:var(--texto);
  }

  .loading-wrap{
    text-align:center;
    padding:60px 20px;
  }
  .spinner{
    width:52px;height:52px;
    margin:0 auto 20px;
    border:5px solid #E1E6EE;
    border-top-color:var(--naranja);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{
    color:var(--azul-principal);
    font-weight:600;
    font-size:14.5px;
  }

  .error-box{
    background:#FDEDEA;
    border:1.5px solid var(--naranja);
    color:#8A2E0C;
    padding:14px 16px;
    border-radius:9px;
    font-size:13.5px;
    margin-top:16px;
    margin-bottom:16px;
  }

  .upload-box{
    border:1.5px dashed #B9C4D4;
    border-radius:10px;
    padding:16px;
    margin-top:8px;
    background:#FAFBFD;
  }
  .upload-status{
    margin-top:12px;
    font-size:13px;
  }
  .upload-status.ready{
    background:#EAF7EE;
    border:1px solid #8FCB9E;
    color:#1E6B34;
    padding:10px 12px;
    border-radius:8px;
  }
  .upload-preview{
    margin-top:8px;
    font-size:12px;
    color:#5B6B80;
    background:var(--blanco);
    border:1px solid #E1E6EE;
    border-radius:6px;
    padding:8px 10px;
    max-height:110px;
    overflow:auto;
    white-space:pre-wrap;
  }

  /* Documento Generado */
  .doc-wrap{
    background:var(--blanco);
    border-radius:14px;
    box-shadow:0 2px 12px rgba(2,36,79,0.08);
    overflow:hidden;
  }
  .doc-header{
    background:var(--azul-principal);
    color:var(--blanco);
    padding:26px 30px;
    text-align:center;
  }
  .doc-header h2{
    margin:0 0 4px;
    font-size:16px;
    letter-spacing:.3px;
  }
  .doc-header h3{
    margin:2px 0;
    font-size:12.5px;
    font-weight:500;
    color:#CFE0F5;
  }
  .doc-header .titulo-guia{
    margin-top:14px;
    font-size:20px;
    font-weight:800;
    color:var(--dorado);
    letter-spacing:.5px;
  }
  .doc-body{padding:26px 30px 36px;}
  .doc-section{margin-top:30px;}
  .doc-section h4{
    color:var(--blanco);
    background:var(--azul-secundario);
    display:inline-block;
    padding:6px 14px;
    border-radius:6px;
    font-size:13.5px;
    margin:0 0 12px;
  }
  .doc-section .accent-bar{
    height:3px;
    width:46px;
    background:var(--naranja);
    border-radius:3px;
    margin-bottom:14px;
  }
  .doc-section p{
    font-size:13.8px;
    line-height:1.65;
    color:#2B384A;
    white-space:pre-wrap;
    margin:0 0 12px 0;
  }
  .doc-list{
    margin:6px 0 0 22px;
    padding:0;
    font-size:13.8px;
    line-height:1.65;
    color:#2B384A;
  }
  .doc-list li{
    margin-bottom:6px;
  }
  table.doc-table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    font-size:12.5px;
  }
  table.doc-table th{
    background:var(--azul-secundario);
    color:var(--blanco);
    padding:9px 10px;
    text-align:left;
    border:1px solid var(--azul-principal);
  }
  table.doc-table td{
    padding:9px 10px;
    border:1px solid #E1E6EE;
    vertical-align:top;
    color:#2B384A;
  }
  table.doc-table tr:nth-child(even) td{background:#F3F7FC;}
  table.identif td{
    border:1px solid #E1E6EE;
    padding:8px 10px;
  }
  table.identif td.label{
    background:#EAF1FB;
    font-weight:700;
    color:var(--azul-principal);
    width:30%;
  }
  .doc-footer{
    text-align:center;
    padding:18px;
    font-size:11.5px;
    color:#8B96A5;
    border-top:1px solid #EEF1F5;
    margin-top:30px;
  }
  .export-bar{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:18px 0 24px;
  }

  details.config-box{
    margin-top:24px;
    background:#FAFBFD;
    border:1.5px solid #E1E6EE;
    border-radius:10px;
    padding:14px;
  }
  details.config-box summary{
    font-weight:700;
    color:var(--azul-principal);
    cursor:pointer;
    font-size:13.5px;
  }

  @media print{
    body{background:#fff;}
    .app{max-width:100%;padding:0;}
    .topbar, .steps, .export-bar, .no-print{display:none !important;}
    .doc-wrap{box-shadow:none;}
    .page-break{page-break-before:always;}
  }
</style>

<!-- Librerías cliente necesarias para DOCX, PDF y Exportación visual -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Generador de Guía Metodológica</h1>
      <p>UPNFM · Programa de Educación Virtual</p>
    </div>
    <div class="badge" id="stepBadge">Paso 1 de 4</div>
  </div>

  <div class="steps no-print" id="stepsNav"></div>

  <div id="content"></div>
</div>

<script>
// 1. Catálogos exactos institucionales UPNFM
const FACULTADES = [
  "Facultad de Humanidades",
  "Facultad de Ciencias de la Educación",
  "Facultad de Ciencias Básicas",
  "Facultad de Tecnología (FATEC)",
  "FUNDAUPN",
  "Otro"
];

const DEPARTAMENTOS_POR_FACULTAD = {
  "Facultad de Ciencias de la Educación": [
    "Administración y Gestión de la Educación",
    "Educación Básica (FID)",
    "Educación Preescolar",
    "Educación Especial",
    "Orientación Educativa",
    "Otro"
  ],
  "Facultad de Ciencias Básicas": [
    "Ciencias Naturales",
    "Ciencias Matemáticas",
    "Educación Física",
    "Otro"
  ],
  "Facultad de Humanidades": [
    "Ciencias Sociales",
    "Letras y Lenguas / Enseñanza del Español",
    "Enseñanza del Inglés",
    "Educación Artística",
    "Otro"
  ],
  "Facultad de Tecnología (FATEC)": [
    "Educación Comercial",
    "Educación Técnica Industrial",
    "Turismo y Hostelería",
    "Informática Educativa",
    "Otro"
  ],
  "FUNDAUPN": [
    "Otro"
  ],
  "Otro": [
    "Otro"
  ]
};

const MODALIDADES = [
  "Modalidad Presencial (Sistema Regular)",
  "Modalidad a Distancia (VREAD)",
  "Modalidad Semipresencial / Híbrida",
  "Programas Especiales de Profesionalización (PREUFOD / PFP)"
];

// 2. Estado Global de la Aplicación
const state = {
  step: 1,
  docente: {
    nombre: '',
    email: '',
    horarioAtencion: ''
  },
  espacio: {
    facultad: 'Facultad de Tecnología (FATEC)',
    facultadOtro: '',
    depto: 'Informática Educativa',
    deptoOtro: '',
    periodo: '',
    codigo: '',
    nombreEspacio: '',
    uv: '3',
    requisitos: 'Ninguno',
    modalidad: 'Modalidad a Distancia (VREAD)',
    fechas: '',
    horarioClase: ''
  },
  descripcion: '',
  uploadedFile: { name: '', text: '', status: 'idle', error: '' },
  generated: null,
  loading: false,
  error: null,
  // Proveedores de IA universales
  apiProvider: localStorage.getItem('gm_universal_provider') || 'anthropic',
  apiKey: localStorage.getItem('gm_universal_key') || '',
  apiModel: localStorage.getItem('gm_universal_model') || 'claude-3-5-sonnet-20241022',
  apiBaseUrl: localStorage.getItem('gm_universal_baseurl') || 'https://api.openai.com/v1'
};

function getFacultadFinal(){
  return state.espacio.facultad === 'Otro' ? (state.espacio.facultadOtro || 'Otro') : state.espacio.facultad;
}

function getDeptoFinal(){
  return state.espacio.depto === 'Otro' ? (state.espacio.deptoOtro || 'Otro') : state.espacio.depto;
}

// Inicialización
function init(){
  renderStepsNav();
  render();
}

function renderStepsNav(){
  const nav = document.getElementById('stepsNav');
  const badge = document.getElementById('stepBadge');
  badge.textContent = `Paso ${state.step} de 4`;
  nav.innerHTML = '';
  
  const stepTitles = [
    'Paso 1: Datos Docente',
    'Paso 2: Datos Espacio',
    'Paso 3: Insumos e IA',
    'Paso 4: Guía Generada'
  ];

  stepTitles.forEach((title, idx) => {
    const sNum = idx + 1;
    const dot = document.createElement('div');
    dot.className = `step-dot ${state.step === sNum ? 'active' : ''} ${state.step > sNum ? 'done' : ''}`;
    dot.textContent = title;
    dot.onclick = () => {
      if(state.loading) return;
      if(sNum < state.step || validarPaso(state.step)){
        state.step = sNum;
        state.error = null;
        renderStepsNav();
        render();
      }
    };
    nav.appendChild(dot);
  });
}

function validarPaso(step){
  if(step === 1){
    return state.docente.nombre && state.docente.email && state.docente.horarioAtencion;
  }
  if(step === 2){
    return state.espacio.nombreEspacio && state.espacio.codigo && state.espacio.periodo;
  }
  return true;
}

// Router de Vistas
function render(){
  renderStepsNav();
  const container = document.getElementById('content');
  container.innerHTML = '';

  if(state.loading){
    renderLoading(container);
    return;
  }

  if(state.error){
    const err = document.createElement('div');
    err.className = 'error-box';
    err.innerHTML = `<strong>Atención:</strong> ${escapeHtml(state.error)}`;
    container.appendChild(err);
  }

  if(state.step === 1) renderStep1(container);
  else if(state.step === 2) renderStep2(container);
  else if(state.step === 3) renderStep3(container);
  else if(state.step === 4) renderStep4(container);
}

function renderLoading(container){
  container.innerHTML = `
    <div class="card">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div class="loading-msg">Generando Guía Metodológica Institucional con Inteligencia Artificial...</div>
        <p class="hint" style="margin-top:12px;">El modelo ${escapeHtml(state.apiModel)} está redactando las competencias, unidades temáticas, encuentros tutoriales y criterios de evaluación.</p>
      </div>
    </div>
  `;
}

// Paso 1: Datos del Docente
function renderStep1(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Paso 1: Datos del <span>Profesor(a)</span></h2>
    
    <label class="required">Nombre completo del profesor(a)</label>
    <input type="text" id="doc_nombre" value="${escapeHtml(state.docente.nombre)}" placeholder="Ej. Kenfor Euceda">

    <div class="grid2">
      <div>
        <label class="required">Correo electrónico institucional</label>
        <input type="email" id="doc_email" value="${escapeHtml(state.docente.email)}" placeholder="ejemplo@upnfm.edu.hn">
      </div>
      <div>
        <label class="required">Horario de atención a consultas</label>
        <input type="text" id="doc_horario" value="${escapeHtml(state.docente.horarioAtencion)}" placeholder="Ej. Lunes a Viernes de 4:00 PM a 6:00 PM">
      </div>
    </div>

    <div class="nav-row">
      <div></div>
      <button class="btn-primary" onclick="guardarStep1()">Siguiente: Datos del Espacio →</button>
    </div>
  `;
  container.appendChild(card);
}

function guardarStep1(){
  const nombre = document.getElementById('doc_nombre').value.trim();
  const email = document.getElementById('doc_email').value.trim();
  const horario = document.getElementById('doc_horario').value.trim();

  if(!nombre || !email || !horario){
    state.error = 'Por favor completa todos los campos requeridos del docente.';
    render();
    return;
  }

  state.docente.nombre = nombre;
  state.docente.email = email;
  state.docente.horarioAtencion = horario;
  state.error = null;
  state.step = 2;
  render();
}

// Paso 2: Datos del Espacio Formativo
function renderStep2(container){
  const card = document.createElement('div');
  card.className = 'card';

  const facultadesOpts = FACULTADES.map(f => `<option value="${f}" ${state.espacio.facultad === f ? 'selected':''}>${f}</option>`).join('');
  const deptosActuales = DEPARTAMENTOS_POR_FACULTAD[state.espacio.facultad] || ["Otro"];
  const deptosOpts = deptosActuales.map(d => `<option value="${d}" ${state.espacio.depto === d ? 'selected':''}>${d}</option>`).join('');
  const modalidadesOpts = MODALIDADES.map(m => `<option value="${m}" ${state.espacio.modalidad === m ? 'selected':''}>${m}</option>`).join('');

  card.innerHTML = `
    <h2>Paso 2: Identificación del <span>Espacio Pedagógico</span></h2>

    <div class="grid2">
      <div>
        <label class="required">Facultad</label>
        <select id="esp_facultad" onchange="onFacultadChange(this.value)">${facultadesOpts}</select>
        <input type="text" id="esp_facultadOtro" style="margin-top:6px; display:${state.espacio.facultad === 'Otro' ? 'block':'none'};" placeholder="Escribe el nombre de la facultad" value="${escapeHtml(state.espacio.facultadOtro)}">
      </div>
      <div>
        <label class="required">Departamento / Sección Académica</label>
        <select id="esp_depto" onchange="onDeptoChange(this.value)">${deptosOpts}</select>
        <input type="text" id="esp_deptoOtro" style="margin-top:6px; display:${state.espacio.depto === 'Otro' ? 'block':'none'};" placeholder="Escribe el departamento o sección" value="${escapeHtml(state.espacio.deptoOtro)}">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label class="required">Nombre del Espacio Pedagógico</label>
        <input type="text" id="esp_nombre" value="${escapeHtml(state.espacio.nombreEspacio)}" placeholder="Ej. Taller de Recursos Didácticos">
      </div>
      <div>
        <label class="required">Código del Espacio</label>
        <input type="text" id="esp_codigo" value="${escapeHtml(state.espacio.codigo)}" placeholder="Ej. TED-2004">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label class="required">Periodo Académico</label>
        <input type="text" id="esp_periodo" value="${escapeHtml(state.espacio.periodo)}" placeholder="Ej. III Periodo Académico 2026">
      </div>
      <div>
        <label class="required">Modalidad</label>
        <select id="esp_modalidad">${modalidadesOpts}</select>
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Unidades Valorativas (UV)</label>
        <input type="text" id="esp_uv" value="${escapeHtml(state.espacio.uv)}" placeholder="Ej. 3 UV">
      </div>
      <div>
        <label>Requisitos Académicos</label>
        <input type="text" id="esp_requisitos" value="${escapeHtml(state.espacio.requisitos)}" placeholder="Ej. Ninguno">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Fechas de Inicio y Fin</label>
        <input type="text" id="esp_fechas" value="${escapeHtml(state.espacio.fechas)}" placeholder="Ej. Del 15 de Septiembre al 10 de Diciembre de 2026">
      </div>
      <div>
        <label>Horario de la Clase</label>
        <input type="text" id="esp_horario" value="${escapeHtml(state.espacio.horarioClase)}" placeholder="Ej. Sábados de 8:00 AM a 12:00 MD">
      </div>
    </div>

    <div class="nav-row">
      <button class="btn-secondary" onclick="state.step=1; render();">← Atrás</button>
      <button class="btn-primary" onclick="guardarStep2()">Siguiente: Insumos de Contenido →</button>
    </div>
  `;
  container.appendChild(card);
}

function onFacultadChange(fac){
  state.espacio.facultad = fac;
  const list = DEPARTAMENTOS_POR_FACULTAD[fac] || ["Otro"];
  state.espacio.depto = list[0];
  state.espacio.facultadOtro = '';
  state.espacio.deptoOtro = '';
  render();
}

function onDeptoChange(dep){
  state.espacio.depto = dep;
  const inp = document.getElementById('esp_deptoOtro');
  if(inp) inp.style.display = dep === 'Otro' ? 'block' : 'none';
}

function guardarStep2(){
  state.espacio.nombreEspacio = document.getElementById('esp_nombre').value.trim();
  state.espacio.codigo = document.getElementById('esp_codigo').value.trim();

// Extracción de Texto de Archivos (Mammoth y PDF.js)
async function handleFileUpload(input){
  const file = input.files[0];
  if(!file) return;

  state.uploadedFile = { name: file.name, text: '', status: 'loading', error: '' };
  render();

  try{
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const buffer = await file.arrayBuffer();
    let text = '';

    if(ext === 'docx'){
      const res = await window.mammoth.extractRawText({ arrayBuffer: buffer });
      text = (res.value || '').trim();
    } else if(ext === 'pdf'){
      const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
      let full = '';
      for(let i=1; i<=pdf.numPages; i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        full += content.items.map(it => it.str).join(' ') + '\n\n';
      }
      text = full.trim();
    } else if(ext === 'doc'){
      throw new Error('Formato .doc antiguo no soportado en navegador; convertir a .docx o PDF.');
    } else {
      throw new Error('Formato no compatible. Sube PDF o Word (.docx).');
    }

    state.uploadedFile.status = 'ready';
    state.uploadedFile.text = text;
    state.error = null;
  }catch(err){
    state.uploadedFile.status = 'error';
    state.uploadedFile.error = err.message;
  }
  render();
}

function removeUploadedFile(){
  state.uploadedFile = { name: '', text: '', status: 'idle', error: '' };
  render();
}

// Parseo defensivo y saneamiento JSON
function sanitizeJsonRawControlChars(str){
  let result = '';
  let inString = false;
  for(let i = 0; i < str.length; i++){
    const c = str[i];
    if(c === '"' && (i === 0 || str[i-1] !== '\\')){
      inString = !inString;
      result += c;
    } else if(inString){
      if(c === '\n') result += '\\n';
      else if(c === '\r') {} // ignorar retorno de carro
      else if(c === '\t') result += '\\t';
      else result += c;
    } else {
      result += c;
    }
  }
  return result;
}

function extractJsonBlock(str){
  const first = str.indexOf('{');
  const last = str.lastIndexOf('}');
  if(first !== -1 && last !== -1 && last > first){
    return str.slice(first, last + 1);
  }
  return str;
}

function tryParseJson(rawText){
  const cleaned = rawText.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const block = extractJsonBlock(cleaned);
  try{ return JSON.parse(block); }catch(e1){}
  try{ return JSON.parse(sanitizeJsonRawControlChars(block)); }catch(e2){}
  return JSON.parse(sanitizeJsonRawControlChars(block));
}

// Ejecución Universal Multi-IA
async function dispararGeneracionIA(){
  const descEl = document.getElementById('txt_descripcion');
  if(descEl) state.descripcion = descEl.value.trim();

  const keyEl = document.getElementById('ia_key');
  if(keyEl && keyEl.value.trim()) state.apiKey = keyEl.value.trim();

  // Validación: archivo con texto o descripción >= 15 chars
  const tieneArchivoValido = state.uploadedFile.status === 'ready' && state.uploadedFile.text.length > 20;
  const tieneDescripcion = state.descripcion.length >= 15;

  if(!tieneArchivoValido && !tieneDescripcion){
    state.error = 'Debes subir un archivo con texto válido o escribir al menos 15 caracteres en la descripción mínima.';
    render();
    return;
  }

  if(!state.apiKey){
    state.error = 'Se requiere una API Key configurada para realizar la generación con IA.';
    render();
    return;
  }

  state.loading = true;
  state.error = null;
  render();

  const prompt = buildPrompt();

  try{
    let rawText = '';
    const { apiProvider, apiKey, apiModel, apiBaseUrl } = state;

    if(apiProvider === 'anthropic'){
      const headers = {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      };
      const resp = await fetch("[https://api.anthropic.com/v1/messages](https://api.anthropic.com/v1/messages)", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: apiModel || "claude-3-5-sonnet-20241022",
          max_tokens: 8000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      if(!resp.ok){
        const errJson = await resp.json().catch(()=>({}));
        throw new Error(errJson.error?.message || `Error HTTP ${resp.status} de Anthropic`);
      }
      const data = await resp.json();
      if(data.stop_reason === 'max_tokens'){
        throw new Error('La respuesta fue truncada por límite de tokens. Intenta con una descripción más concisa.');
      }
      rawText = data.content[0].text;
    } else if(apiProvider === 'openai' || apiProvider === 'compatible'){
      const endpoint = apiProvider === 'openai' 
        ? "[https://api.openai.com/v1/chat/completions](https://api.openai.com/v1/chat/completions)"
        : `${apiBaseUrl.replace(/\/$/, '')}/chat/completions`;

      const resp = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: apiModel || "gpt-4o",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.7
        })
      });
      if(!resp.ok){
        const errJson = await resp.json().catch(()=>({}));
        throw new Error(errJson.error?.message || `Error HTTP ${resp.status} de la API`);
      }
      const data = await resp.json();
      rawText = data.choices[0].message.content;
    } else if(apiProvider === 'gemini'){
      const endpoint = `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){apiModel || 'gemini-1.5-pro'}:generateContent?key=${apiKey}`;
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: 8000, temperature: 0.7 }
        })
      });
      if(!resp.ok){
        const errJson = await resp.json().catch(()=>({}));
        throw new Error(errJson.error?.message || `Error HTTP ${resp.status} de Gemini`);
      }
      const data = await resp.json();
      rawText = data.candidates[0].content.parts[0].text;
    }

    const parsedJson = tryParseJson(rawText);
    state.generated = parsedJson;
    state.step = 4;
  }catch(err){
    state.error = `Fallo en la generación con IA: ${err.message}`;
  }finally{
    state.loading = false;
    render();
  }
}

function toListOrParagraph(str){
  if(!str) return '<p></p>';
  const lines = str.split('\n').map(l => l.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
  if(lines.length > 1){
    return `<ul class="doc-list">${lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
  }
  return `<p>${escapeHtml(str)}</p>`;
}

// 10. Exportación a PDF con html2canvas y jsPDF
async function exportToPdf(btn){
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Procesando PDF...';

  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const margin = 8;
    let isFirstPage = true;

    async function appendElementToPdf(el, orientation, scale = 2){
      const canvas = await html2canvas(el, {
        scale: scale,
        backgroundColor: '#FFFFFF',
        useCORS: true,
        logging: false
      });

      const isLandscape = orientation === 'landscape';
      const pageWidth = isLandscape ? 297 : 210;
      const pageHeight = isLandscape ? 210 : 297;
      const usableWidth = pageWidth - (margin * 2);
      const usableHeight = pageHeight - (margin * 2);

      const pxPerMM = canvas.width / usableWidth;
      const pageHeightPx = usableHeight * pxPerMM;

      let renderedPx = 0;

      while(renderedPx < canvas.height){
        const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = sliceHeightPx;
        const ctx = sliceCanvas.getContext('2d');

        ctx.drawImage(
          canvas,
          0, renderedPx, canvas.width, sliceHeightPx,
          0, 0, canvas.width, sliceHeightPx
        );

        const imgData = sliceCanvas.toDataURL('image/png');
        const sliceHeightMM = sliceHeightPx / pxPerMM;

        if(!isFirstPage){
          pdf.addPage('a4', orientation);
        } else {
          isFirstPage = false;
        }

        pdf.addImage(imgData, 'PNG', margin, margin, usableWidth, sliceHeightMM);
        renderedPx += sliceHeightPx;
      }
    }

    // Retrato para Portada y Secciones descriptivas
    await appendElementToPdf(document.getElementById('docPortraitSection'), 'portrait', 2);
    // Paisaje para las Tablas instruccionales
    await appendElementToPdf(document.getElementById('docLandscapeSection'), 'landscape', 2.2);

    const cleanName = (state.espacio.nombreEspacio || 'Guia_Metodologica').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]+/g, '_');
    pdf.save(`Guia_Metodologica_${cleanName}.pdf`);
  }catch(err){
    alert('Error al generar PDF: ' + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function escapeHtml(str){
  if(!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
