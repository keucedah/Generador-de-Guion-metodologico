<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Guía Metodológica</title>
<style>
  :root{
    --azul-principal:#02244F;
    --azul-secundario:#0E408B;
    --naranja:#F05A12;
    --dorado:#F7A307;
    --blanco:#FFFFFF;
    --gris-suave:#F4F6F9;
    --texto:#1B2530;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--gris-suave);
    color:var(--texto);
  }
  .app{
    max-width:960px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .topbar{
    background:linear-gradient(135deg,var(--azul-principal) 0%,var(--azul-secundario) 100%);
    border-radius:14px;
    padding:22px 26px;
    color:var(--blanco);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    box-shadow:0 6px 18px rgba(2,36,79,0.25);
  }
  .topbar h1{
    margin:0;
    font-size:20px;
    letter-spacing:.2px;
  }
  .topbar p{
    margin:4px 0 0;
    font-size:13px;
    color:#CFE0F5;
  }
  .badge{
    background:var(--dorado);
    color:var(--azul-principal);
    font-weight:700;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  .steps{
    display:flex;
    gap:8px;
    margin:22px 0;
  }
  .step-dot{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    background:var(--blanco);
    border:2px solid #E1E6EE;
    font-size:12px;
    font-weight:600;
    color:#8B96A5;
    cursor:pointer;
    transition:all .2s ease;
  }
  .step-dot.active{
    border-color:var(--azul-secundario);
    color:var(--azul-principal);
    background:#EAF1FB;
  }
  .step-dot.done{
    border-color:var(--dorado);
    color:var(--azul-principal);
    background:#FFF6E4;
  }

  .card{
    background:var(--blanco);
    border-radius:14px;
    padding:28px;
    box-shadow:0 2px 12px rgba(2,36,79,0.08);
    border-top:5px solid var(--naranja);
  }
  .card h2{
    margin-top:0;
    color:var(--azul-principal);
    font-size:19px;
    border-bottom:2px solid #EEF1F5;
    padding-bottom:12px;
  }
  .card h2 span{
    color:var(--naranja);
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media(max-width:640px){
    .grid2{grid-template-columns:1fr;}
    .topbar{flex-direction:column;align-items:flex-start;}
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--azul-principal);
    margin-bottom:6px;
    margin-top:14px;
  }
  input[type=text], input[type=password], input[type=email], textarea, select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #D8DEE7;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    color:var(--texto);
    background:var(--blanco);
    transition:border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--azul-secundario);
    box-shadow:0 0 0 3px rgba(14,64,139,0.12);
  }
  textarea{resize:vertical; min-height:100px;}
  .hint{
    font-size:12px;
    color:#7A8697;
    margin-top:4px;
  }
  .required::after{
    content:" *";
    color:var(--naranja);
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:26px;
    gap:12px;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:9px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:.55; cursor:not-allowed;}
  .btn-primary{
    background:var(--naranja);
    color:var(--blanco);
    box-shadow:0 4px 10px rgba(240,90,18,0.3);
  }
  .btn-primary:hover:not(:disabled){box-shadow:0 6px 14px rgba(240,90,18,0.4);}
  .btn-secondary{
    background:var(--blanco);
    color:var(--azul-secundario);
    border:1.5px solid var(--azul-secundario);
  }
  .btn-gold{
    background:var(--dorado);
    color:var(--azul-principal);
  }
  .btn-outline{
    background:transparent;
    border:1.5px solid #D8DEE7;
    color:var(--texto);
  }

  .loading-wrap{
    text-align:center;
    padding:60px 20px;
  }
  .spinner{
    width:52px;height:52px;
    margin:0 auto 20px;
    border:5px solid #E1E6EE;
    border-top-color:var(--naranja);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{
    color:var(--azul-principal);
    font-weight:600;
    font-size:14.5px;
  }

  .error-box{
    background:#FDEDEA;
    border:1.5px solid var(--naranja);
    color:#8A2E0C;
    padding:14px 16px;
    border-radius:9px;
    font-size:13.5px;
    margin-top:16px;
  }

  .upload-box{
    border:1.5px dashed #B9C4D4;
    border-radius:10px;
    padding:16px;
    margin-top:8px;
    background:#FAFBFD;
  }
  .upload-box input[type=file]{
    font-size:13px;
  }
  .upload-status{
    margin-top:12px;
    font-size:13px;
  }
  .upload-status.ready{
    background:#EAF7EE;
    border:1px solid #8FCB9E;
    color:#1E6B34;
    padding:10px 12px;
    border-radius:8px;
  }
  .upload-status.loading{
    color:var(--azul-secundario);
    font-weight:600;
  }
  .upload-preview{
    margin-top:8px;
    font-size:12px;
    color:#5B6B80;
    background:var(--blanco);
    border:1px solid #E1E6EE;
    border-radius:6px;
    padding:8px 10px;
    max-height:110px;
    overflow:auto;
    white-space:pre-wrap;
  }
  .divider-or{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0 4px;
    color:#9AA6B5;
    font-size:12px;
    font-weight:700;
  }
  .divider-or::before, .divider-or::after{
    content:'';
    flex:1;
    height:1px;
    background:#E1E6EE;
  }

  /* ---- Preview / documento generado ---- */
  .doc-wrap{
    background:var(--blanco);
    border-radius:14px;
    box-shadow:0 2px 12px rgba(2,36,79,0.08);
    overflow:hidden;
  }
  .doc-header{
    background:var(--azul-principal);
    color:var(--blanco);
    padding:26px 30px;
    text-align:center;
  }
  .doc-header h2{
    margin:0 0 4px;
    font-size:16px;
    letter-spacing:.3px;
  }
  .doc-header h3{
    margin:2px 0;
    font-size:12.5px;
    font-weight:500;
    color:#CFE0F5;
  }
  .doc-header .titulo-guia{
    margin-top:14px;
    font-size:20px;
    font-weight:800;
    color:var(--dorado);
    letter-spacing:.5px;
  }
  .doc-body{padding:26px 30px 36px;}
  .doc-section{margin-top:30px;}
  .doc-section h4{
    color:var(--blanco);
    background:var(--azul-secundario);
    display:inline-block;
    padding:6px 14px;
    border-radius:6px;
    font-size:13.5px;
    margin:0 0 12px;
  }
  .doc-section .accent-bar{
    height:3px;
    width:46px;
    background:var(--naranja);
    border-radius:3px;
    margin-bottom:14px;
  }
  .doc-section p{
    font-size:13.8px;
    line-height:1.65;
    color:#2B384A;
    white-space:pre-wrap;
  }
  .doc-list{
    margin:6px 0 0 22px;
    padding:0;
    font-size:13.8px;
    line-height:1.65;
    color:#2B384A;
  }
  .doc-list li{
    margin-bottom:6px;
  }
  table.doc-table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    font-size:12.8px;
  }
  table.doc-table th{
    background:var(--azul-secundario);
    color:var(--blanco);
    padding:9px 10px;
    text-align:left;
    border:1px solid var(--azul-principal);
  }
  table.doc-table td{
    padding:9px 10px;
    border:1px solid #E1E6EE;
    vertical-align:top;
    color:#2B384A;
  }
  table.doc-table tr:nth-child(even) td{background:#F3F7FC;}
  table.identif td{
    border:1px solid #E1E6EE;
    padding:8px 10px;
  }
  table.identif td.label{
    background:#EAF1FB;
    font-weight:700;
    color:var(--azul-principal);
    width:34%;
  }
  .pill{
    display:inline-block;
    background:var(--dorado);
    color:var(--azul-principal);
    font-weight:700;
    font-size:11px;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .doc-footer{
    text-align:center;
    padding:18px;
    font-size:11.5px;
    color:#8B96A5;
    border-top:1px solid #EEF1F5;
  }

  .export-bar{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:18px 0 0;
  }

  @media print{
    body{background:#fff;}
    .app{max-width:100%;padding:0;}
    .topbar, .steps, .export-bar, .no-print{display:none !important;}
    .doc-wrap{box-shadow:none;}
  }
</style>

<!-- Librerías de Extracción y Generación PDF vía CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>Generador de Guía Metodológica</h1>
      <p>UPNFM · Programa de Educación Virtual</p>
    </div>
    <div class="badge" id="stepBadge">Paso 1 de 4</div>
  </div>

  <div class="steps no-print" id="stepsNav"></div>

  <div id="content"></div>

</div>

<script>
// --- DATOS INSTITUCIONALES (Catálogos) ---
const FACULTADES = [
  "Facultad de Humanidades",
  "Facultad de Ciencias de la Educación",
  "Facultad de Ciencias Básicas",
  "Facultad de Tecnología (FATEC)",
  "FUNDAUPN",
  "Otro"
];

const DEPARTAMENTOS = {
  "Facultad de Ciencias de la Educación": [
    "Administración y Gestión de la Educación", "Educación Básica (FID)", "Educación Preescolar", "Educación Especial", "Orientación Educativa", "Otro"
  ],
  "Facultad de Ciencias Básicas": [
    "Ciencias Naturales", "Ciencias Matemáticas", "Educación Física", "Otro"
  ],
  "Facultad de Humanidades": [
    "Ciencias Sociales", "Letras y Lenguas / Enseñanza del Español", "Enseñanza del Inglés", "Educación Artística", "Otro"
  ],
  "Facultad de Tecnología (FATEC)": [
    "Educación Comercial", "Educación Técnica Industrial", "Turismo y Hostelería", "Informática Educativa", "Otro"
  ],
  "FUNDAUPN": ["Otro"],
  "Otro": ["Otro"]
};

const MODALIDADES = [
  "Modalidad Presencial (Sistema Regular)",
  "Modalidad a Distancia (VREAD)",
  "Modalidad Semipresencial / Híbrida",
  "Programas Especiales de Profesionalización (PREUFOD / PFP)"
];

// --- ESTADO Y VARIABLES GLOBALES ---
const state = {
  step: 1,
  loading: false,
  error: null,
  config: {
    provider: localStorage.getItem('gm_provider') || 'gemini',
    apiKey: localStorage.getItem('gm_apiKey') || '',
    model: localStorage.getItem('gm_model') || 'gemini-1.5-flash',
    baseUrl: localStorage.getItem('gm_baseUrl') || 'https://api.openai.com/v1'
  },
  docente: { nombre: '', email: '', horarioAtencion: '' },
  espacio: {
    facultad: 'Facultad de Tecnología (FATEC)', facultadOtro: '',
    depto: 'Informática Educativa', deptoOtro: '',
    periodo: '', codigo: '', nombreEspacio: '',
    uv: '', requisitos: '', modalidad: MODALIDADES[1],
    fechas: '', horarioClase: ''
  },
  descripcion: '',
  uploadedFile: { name: '', text: '', status: 'idle', error: '' },
  generated: null
};

const stepsNames = [
  '1. Configuración e IA',
  '2. Datos de Asignatura',
  '3. Sílabo y Planificación',
  '4. Guía Metodológica'
];

function getFacultadFinal(){ return state.espacio.facultad === 'Otro' ? (state.espacio.facultadOtro || 'Otro') : state.espacio.facultad; }
function getDeptoFinal(){ return state.espacio.depto === 'Otro' ? (state.espacio.deptoOtro || 'Otro') : state.espacio.depto; }

// --- INICIALIZACIÓN Y ROUTER ---
function init(){
  renderSteps();
  renderContent();
}

function renderSteps(){
  const nav = document.getElementById('stepsNav');
  const badge = document.getElementById('stepBadge');
  badge.textContent = `Paso ${state.step} de 4`;
  nav.innerHTML = '';
  
  stepsNames.forEach((name, idx) => {
    const num = idx + 1;
    const dot = document.createElement('div');
    dot.className = `step-dot ${state.step === num ? 'active' : ''} ${state.step > num ? 'done' : ''}`;
    dot.textContent = name;
    dot.onclick = () => {
      if(state.loading) return;
      if(num < state.step || validarPasoActual(state.step)){
        state.step = num;
        state.error = null;
        renderSteps();
        renderContent();
      }
    };
    nav.appendChild(dot);
  });
}

function validarPasoActual(step){
  if(step === 1) return !!state.config.apiKey;
  if(step === 2) return !!state.espacio.nombreEspacio;
  return true;
}

function renderContent(){
  const container = document.getElementById('content');
  container.innerHTML = '';

  if(state.loading){
    container.innerHTML = `
      <div class="card">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <div class="loading-msg">Generando guía con ${state.config.provider.toUpperCase()}...</div>
          <p class="hint" style="margin-top:10px;">El modelo ${state.config.model} está procesando el guion instruccional.</p>
        </div>
      </div>
    `;
    return;
  }

  if(state.error){
    const errBox = document.createElement('div');
    errBox.className = 'error-box';
    errBox.innerHTML = `<strong>Error:</strong> ${state.error}`;
    container.appendChild(errBox);
  }

  if(state.step === 1) renderStep1(container);
  else if(state.step === 2) renderStep2(container);
  else if(state.step === 3) renderStep3(container);
  else if(state.step === 4) renderStep4(container);
}

// --- PASO 1: Configuración de IA y Docente ---
function renderStep1(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Paso 1: Configuración de <span>IA y Docente</span></h2>
    
    <!-- Configuración IA -->
    <div style="background:#F8F9FA; padding:15px; border-radius:8px; border:1px solid #E2E8F0; margin-bottom:20px;">
      <h3 style="margin:0 0 10px 0; font-size:14px; color:var(--azul-principal);">Configuración de Inteligencia Artificial</h3>
      <div class="grid2">
        <div>
          <label>Proveedor de IA</label>
          <select id="selProvider" onchange="cambiarProveedor(this.value)">
            <option value="gemini" ${state.config.provider === 'gemini' ? 'selected' : ''}>Google Gemini</option>
            <option value="anthropic" ${state.config.provider === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option>
            <option value="openai" ${state.config.provider === 'openai' ? 'selected' : ''}>OpenAI (ChatGPT)</option>
            <option value="compatible" ${state.config.provider === 'compatible' ? 'selected' : ''}>Compatible (DeepSeek, Groq, etc.)</option>
          </select>
        </div>
        <div>
          <label>Modelo</label>
          <input type="text" id="txtModel" value="${state.config.model}">
        </div>
      </div>
      <div id="boxBaseUrl" style="display: ${state.config.provider === 'compatible' ? 'block' : 'none'}; margin-top:10px;">
        <label>Base URL de la API</label>
        <input type="text" id="txtBaseUrl" value="${state.config.baseUrl}">
      </div>
      <div style="margin-top:10px;">
        <label class="required">API Key</label>
        <input type="password" id="txtApiKey" value="${state.config.apiKey}" placeholder="Pega tu API Key aquí">
        <div class="hint">Tus datos se guardan solo en tu navegador localmente.</div>
      </div>
    </div>

    <!-- Datos Docente -->
    <label class="required">Nombre del Docente</label>
    <input type="text" id="doc_nombre" value="${state.docente.nombre}" placeholder="Ej: Kenfor Euceda">

    <div class="grid2" style="margin-top:10px;">
      <div>
        <label class="required">Correo Institucional</label>
        <input type="email" id="doc_email" value="${state.docente.email}" placeholder="correo@upnfm.edu.hn">
      </div>
      <div>
        <label class="required">Horario de Consultas</label>
        <input type="text" id="doc_horario" value="${state.docente.horarioAtencion}" placeholder="Lunes a Viernes de 4 a 6 PM">
      </div>
    </div>

    <div class="nav-row">
      <div></div>
      <button class="btn-primary" onclick="guardarPaso1()">Continuar a Datos de Espacio →</button>
    </div>
  `;
  container.appendChild(card);
}

function cambiarProveedor(prov){
  state.config.provider = prov;
  const baseUrlBox = document.getElementById('boxBaseUrl');
  const txtModel = document.getElementById('txtModel');

  if(prov === 'anthropic'){
    baseUrlBox.style.display = 'none';
    txtModel.value = 'claude-3-5-sonnet-20241022';
  } else if(prov === 'openai'){
    baseUrlBox.style.display = 'none';
    txtModel.value = 'gpt-4o';
  } else if(prov === 'gemini'){
    baseUrlBox.style.display = 'none';
    txtModel.value = 'gemini-1.5-flash';
  } else if(prov === 'compatible'){
    baseUrlBox.style.display = 'block';
    txtModel.value = 'deepseek-chat';
  }
}

function guardarPaso1(){
  const provider = document.getElementById('selProvider').value;
  const model = document.getElementById('txtModel').value.trim();
  const apiKey = document.getElementById('txtApiKey').value.trim();
  const baseUrl = document.getElementById('txtBaseUrl') ? document.getElementById('txtBaseUrl').value.trim() : '';

  const nombre = document.getElementById('doc_nombre').value.trim();
  const email = document.getElementById('doc_email').value.trim();
  const horario = document.getElementById('doc_horario').value.trim();

  if(!apiKey || !nombre || !email || !horario){
    state.error = 'Por favor ingresa la API Key y los datos del docente requeridos.';
    renderContent();
    return;
  }

  state.config.provider = provider;
  state.config.apiKey = apiKey;
  state.config.model = model;
  state.config.baseUrl = baseUrl;
  localStorage.setItem('gm_provider', provider);
  localStorage.setItem('gm_apiKey', apiKey);
  localStorage.setItem('gm_model', model);
  localStorage.setItem('gm_baseUrl', baseUrl);

  state.docente = { nombre, email, horarioAtencion: horario };
  state.error = null;
  state.step = 2;
  renderSteps();
  renderContent();
}

// --- PASO 2: Datos del Espacio Pedagógico ---
function renderStep2(container){
  const card = document.createElement('div');
  card.className = 'card';

  const facOpts = FACULTADES.map(f => `<option value="${f}" ${state.espacio.facultad === f ? 'selected':''}>${f}</option>`).join('');
  const deptosList = DEPARTAMENTOS[state.espacio.facultad] || ["Otro"];
  const deptoOpts = deptosList.map(d => `<option value="${d}" ${state.espacio.depto === d ? 'selected':''}>${d}</option>`).join('');
  const modOpts = MODALIDADES.map(m => `<option value="${m}" ${state.espacio.modalidad === m ? 'selected':''}>${m}</option>`).join('');

  card.innerHTML = `
    <h2>Paso 2: Datos del <span>Espacio Pedagógico</span></h2>
    
    <div class="grid2">
      <div>
        <label class="required">Facultad</label>
        <select id="esp_facultad" onchange="onFacChange(this.value)">${facOpts}</select>
        <input type="text" id="esp_facultadOtro" style="margin-top:6px; display:${state.espacio.facultad === 'Otro' ? 'block':'none'};" placeholder="Escribe la facultad" value="${escapeHtml(state.espacio.facultadOtro)}">
      </div>
      <div>
        <label class="required">Departamento / Sección</label>
        <select id="esp_depto" onchange="onDepChange(this.value)">${deptoOpts}</select>
        <input type="text" id="esp_deptoOtro" style="margin-top:6px; display:${state.espacio.depto === 'Otro' ? 'block':'none'};" placeholder="Escribe el departamento" value="${escapeHtml(state.espacio.deptoOtro)}">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label class="required">Espacio Pedagógico</label>
        <input type="text" id="esp_nombre" value="${escapeHtml(state.espacio.nombreEspacio)}" placeholder="Ej: Metodología de Investigación">
      </div>
      <div>
        <label class="required">Código</label>

function quitarArchivo(){
  state.uploadedFile = { name: '', text: '', status: 'idle', error: '' };
  renderContent();

async function procesarArchivo(input){
  const file = input.files[0];
  if(!file) return;

  state.uploadedFile = { name: file.name, text: '', status: 'loading', error: '' };
  renderContent();

  try{
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const buffer = await file.arrayBuffer();
    let text = '';

    if(ext === 'docx'){
      const res = await window.mammoth.extractRawText({ arrayBuffer: buffer });
      text = (res.value || '').trim();
    } else if(ext === 'pdf'){
      const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
      let paginas = [];
      for(let i=1; i<=pdf.numPages; i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        paginas.push(content.items.map(it => it.str).join(' '));
      }
      text = paginas.join('\n\n');
    } else {
      throw new Error('Formato no soportado. Sube PDF o Word (.docx).');
    }

    state.uploadedFile.status = 'ready';
    state.uploadedFile.text = text;
    state.error = null;
  }catch(e){
    state.uploadedFile.status = 'error';
    state.uploadedFile.error = e.message;
  }
  renderContent();
}

// === GENERACIÓN CON IA ===
async function ejecutarGeneracion(){
  state.descripcion = document.getElementById('txt_desc').value.trim();
  
  const fileText = state.uploadedFile.status === 'ready' ? state.uploadedFile.text.slice(0, 12000) : '';
  if(fileText.length < 20 && state.descripcion.length < 15){
    state.error = 'Sube un archivo válido o redacta al menos 15 caracteres en la descripción.';
    renderContent();
    return;
  }

  state.loading = true;
  state.error = null;
  renderContent();

  const prompt = buildPrompt(fileText, state.descripcion);
  
  try {
    let rawText = '';
    const { provider, apiKey, model, baseUrl } = state.config;

    if(provider === 'anthropic'){
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey.trim(),
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: model.trim() || "claude-3-5-sonnet-20241022",
          max_tokens: 8000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      if(!resp.ok){
        const e = await resp.json().catch(()=>({}));
        throw new Error(e.error?.message || `Error HTTP ${resp.status}`);
      }
      const data = await resp.json();
      rawText = data.content[0].text;
    } 
    else if(provider === 'openai' || provider === 'compatible'){
      const endpoint = provider === 'openai' ? "https://api.openai.com/v1/chat/completions" : `${baseUrl.replace(/\/$/, '')}/chat/completions`;
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey.trim()}`
        },
        body: JSON.stringify({
          model: model.trim() || "gpt-4o",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.4
        })
      });
      if(!resp.ok){
        const e = await resp.json().catch(()=>({}));
        throw new Error(e.error?.message || `Error HTTP ${resp.status}`);
      }
      const data = await resp.json();
      rawText = data.choices[0].message.content;
    }
    // CORRECCIÓN EXACTA PARA GEMINI
    else if(provider === 'gemini'){
      const modeloStr = model.trim() || 'gemini-1.5-flash';
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modeloStr}:generateContent?key=${apiKey.trim()}`;
      
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: "Eres un especialista en diseño curricular. Responde SOLO en JSON." }] },
          contents: [{ 
            role: "user",
            parts: [{ text: prompt }] 
          }],
          generationConfig: { 
            temperature: 0.4,
            maxOutputTokens: 8192,
            responseMimeType: "application/json"
          }
        })
      });
      if(!resp.ok){
        const e = await resp.json().catch(()=>({}));
        throw new Error(e.error?.message || `Error HTTP ${resp.status}`);
      }
      const data = await resp.json();
      rawText = data.candidates[0].content.parts[0].text;
    }

    state.generated = tryParseJson(rawText);
    state.step = 4;
  } catch(err) {
    state.error = `Fallo en la generación con IA: ${err.message}`;
  } finally {
    state.loading = false;
    renderSteps();
    renderContent();
  }
}

// Saneamiento y Parseo JSON
function tryParseJson(raw){
  let t = raw.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const first = t.indexOf('{');
  const last = t.lastIndexOf('}');
  if(first !== -1 && last !== -1) t = t.slice(first, last + 1);

  // Saneamiento de saltos de línea crudos dentro de strings JSON
  let sanitized = '';
  let inString = false;
  for(let i=0; i<t.length; i++){
    const c = t[i];
    if(c === '"' && (i===0 || t[i-1] !== '\\')) inString = !inString;
    if(inString && c === '\n') sanitized += '\\n';
    else if(inString && c === '\r') {} 
    else if(inString && c === '\t') sanitized += '\\t';
    else sanitized += c;
  }

  return JSON.parse(sanitized);
}

function toListOrParagraph(str){
  if(!str) return '<p></p>';
  const lines = str.split('\n').map(l => l.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
  if(lines.length > 1) return `<ul class="doc-list">${lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
  return `<p>${escapeHtml(str)}</p>`;
}

// Exportar PDF
async function exportToPdf(btn){
  const original = btn.textContent;
  btn.textContent = 'Generando PDF...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    let isFirst = true;

    async function addSlices(elementId, orientation){
      const el = document.getElementById(elementId);
      const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#FFFFFF' });
      const margin = 8;
      const usableW = (orientation==='landscape'?297:210) - margin*2;
      const usableH = (orientation==='landscape'?210:297) - margin*2;
      const pxPerMM = canvas.width / usableW;
      const pageHeightPx = usableH * pxPerMM;

      let renderedPx = 0;
      while(renderedPx < canvas.height){
        const sliceH = Math.min(pageHeightPx, canvas.height - renderedPx);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width; sliceCanvas.height = sliceH;
        sliceCanvas.getContext('2d').drawImage(canvas, 0, renderedPx, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        
        if(!isFirst) pdf.addPage('a4', orientation);
        isFirst = false;

        pdf.addImage(sliceCanvas.toDataURL('image/png'), 'PNG', margin, margin, usableW, sliceH/pxPerMM);
        renderedPx += sliceH;
      }
    }

    await addSlices('docPortraitSection', 'portrait');
    await addSlices('docLandscapeSection', 'landscape');

    const cleanName = (state.espacio.nombreEspacio || 'Guia').replace(/[^a-zA-Z0-9áéíóúñÑ]+/g, '_');
    pdf.save(`Guia_Metodologica_${cleanName}.pdf`);
  } catch(e) {
    alert("Error PDF: " + e.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

window.onload = init;
</script>
</body>
