<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Guía Metodológica Multi-IA</title>
<style>
  :root{
    --azul-principal:#02244F;
    --azul-secundario:#0E408B;
    --naranja:#F05A12;
    --dorado:#F7A307;
    --blanco:#FFFFFF;
    --gris-suave:#F4F6F9;
    --texto:#1B2530;
    --borde:#E2E8F0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--gris-suave);
    color:var(--texto);
  }
  .app{
    max-width:980px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .topbar{
    background:linear-gradient(135deg,var(--azul-principal) 0%,var(--azul-secundario) 100%);
    border-radius:14px;
    padding:22px 26px;
    color:var(--blanco);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    box-shadow:0 6px 18px rgba(2,36,79,0.25);
    flex-wrap:wrap;
  }
  .topbar h1{
    margin:0 0 4px 0;
    font-size:22px;
    font-weight:700;
  }
  .topbar p{
    margin:0;
    font-size:13px;
    opacity:0.85;
  }
  .api-status{
    background:rgba(255,255,255,0.12);
    padding:8px 14px;
    border-radius:8px;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.2);
    transition:background 0.2s;
  }
  .api-status:hover{
    background:rgba(255,255,255,0.2);
  }
  .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#e0e0e0;
  }
  .dot.ok{background:#2ECC71;}
  .steps-nav{
    display:flex;
    gap:8px;
    margin:22px 0 16px;
    background:var(--blanco);
    padding:10px 14px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.04);
    overflow-x:auto;
  }
  .step-tab{
    flex:1;
    min-width:120px;
    text-align:center;
    padding:10px 8px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    color:#667085;
    background:#F8F9FA;
    cursor:pointer;
    border:1px solid transparent;
    transition:all 0.2s;
  }
  .step-tab.active{
    background:var(--azul-principal);
    color:var(--blanco);
  }
  .step-tab.done{
    background:rgba(14,64,139,0.08);
    color:var(--azul-secundario);
    border-color:rgba(14,64,139,0.2);
  }
  .card{
    background:var(--blanco);
    border-radius:14px;
    padding:24px 28px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  .card h2{
    margin-top:0;
    color:var(--azul-principal);
    font-size:18px;
    border-bottom:2px solid var(--gris-suave);
    padding-bottom:10px;
  }
  .form-group{
    margin-bottom:14px;
  }
  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media(max-width:680px){
    .form-row{grid-template-columns:1fr;}
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:#344054;
  }
  input[type="text"], input[type="password"], textarea, select{
    width:100%;
    padding:10px 12px;
    border:1px solid #D0D5DD;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#FAFAFA;
    transition:border 0.15s, background 0.15s;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--azul-secundario);
    background:var(--blanco);
    box-shadow:0 0 0 3px rgba(14,64,139,0.1);
  }
  .btn{
    background:var(--azul-principal);
    color:var(--blanco);
    border:none;
    padding:11px 20px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background 0.2s, transform 0.1s;
  }
  .btn:hover{background:var(--azul-secundario);}
  .btn:active{transform:scale(0.98);}
  .btn-accent{
    background:var(--naranja);
  }
  .btn-accent:hover{background:#d84a08;}
  .btn-outline{
    background:transparent;
    color:var(--azul-principal);
    border:1px solid var(--azul-principal);
  }
  .btn-outline:hover{
    background:rgba(2,36,79,0.05);
  }
  .btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  .acciones{
    display:flex;
    justify-content:space-between;
    margin-top:24px;
    gap:10px;
    flex-wrap:wrap;
  }
  .table-resumen{
    width:100%;
    border-collapse:collapse;
    margin:14px 0;
    font-size:13px;
  }
  .table-resumen th, .table-resumen td{
    border:1px solid #E4E7EC;
    padding:10px 12px;
    text-align:left;
  }
  .table-resumen th{
    background:#F8F9FA;
    font-weight:600;
    color:var(--azul-principal);
  }
  .spinner{
    width:22px;
    height:22px;
    border:3px solid rgba(2,36,79,0.2);
    border-top-color:var(--azul-principal);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .badge{
    background:rgba(240,90,18,0.12);
    color:var(--naranja);
    font-size:11px;
    padding:3px 8px;
    border-radius:6px;
    font-weight:600;
  }
  .preview-box{
    border:1px solid #E2E8F0;
    border-radius:10px;
    padding:18px;
    margin-top:14px;
    background:#FAFAFA;
    max-height:480px;
    overflow-y:auto;
  }
  .card-sesion{
    border:1px solid #E4E7EC;
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
    background:#FFFFFF;
  }
  .card-sesion h3{
    margin-top:0;
    color:var(--azul-secundario);
    font-size:15px;
    display:flex;
    justify-content:space-between;
  }
  /* Estilos específicos de impresión / exportación */
  .doc-preview-table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:12px;
  }
  .doc-preview-table th, .doc-preview-table td{
    border:1px solid #333;
    padding:6px 8px;
    vertical-align:top;
  }
  .doc-preview-table th{
    background:#02244F;
    color:#FFF;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div>
      <h1>Generador de Guía Metodológica</h1>
      <p>Planificación instruccional modular con soporte Multi-IA</p>
    </div>
    <div class="api-status" onclick="abrirConfigIA()">
      <div class="dot" id="apiDot"></div>
      <span id="apiStatusText">Configurar IA</span>
      <span class="badge" id="modelBadge">Multi-IA</span>
    </div>
  </header>

  <nav class="steps-nav" id="stepsNav"></nav>

  <main id="content"></main>
</div>

<div id="modalConfigIA" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:9999;">
  <div style="background:#FFF; border-radius:14px; padding:24px 28px; width:90%; max-width:480px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
    <h3 style="margin-top:0; color:var(--azul-principal);">Configuración del Proveedor de IA</h3>
    <div class="form-group">
      <label>Proveedor</label>
      <select id="cfgProvider" onchange="actualizarCamposProveedor()">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI (ChatGPT)</option>
        <option value="gemini">Google Gemini</option>
        <option value="compatible">OpenAI Compatible (DeepSeek, Groq, OpenRouter...)</option>
      </select>
    </div>
    <div class="form-group" id="cfgBaseUrlGroup" style="display:none;">
      <label>Base URL de la API</label>
      <input type="text" id="cfgBaseUrl" placeholder="https://api.deepseek.com/v1">
    </div>
    <div class="form-group">
      <label>Modelo</label>
      <input type="text" id="cfgModel" placeholder="claude-3-5-sonnet-20241022">
      <div style="font-size:11px; color:#667085; margin-top:4px;" id="cfgModelHint">Ejemplos: claude-3-5-sonnet-20241022, claude-3-haiku-20240307</div>
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="cfgApiKey" placeholder="Introduce tu API Key">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn btn-outline" onclick="cerrarConfigIA()">Cerrar</button>
      <button class="btn btn-accent" onclick="guardarConfigIA()">Guardar Configuración</button>
    </div>
  </div>
</div>

<script>
// Estado de la Aplicación
const state = {
  step: 1,
  loading: false,
  loadingMessage: '',
  configIA: {
    provider: localStorage.getItem('gm_ia_provider') || 'anthropic',
    apiKey: localStorage.getItem('gm_ia_key') || '',
    model: localStorage.getItem('gm_ia_model') || 'claude-3-5-sonnet-20241022',
    baseUrl: localStorage.getItem('gm_ia_baseurl') || 'https://api.deepseek.com/v1'
  },
  espacio: {
    nombreEspacio: '',
    objetivoGeneral: '',
    publicoMeta: '',
    duracionHoras: 12,
    cantidadModulos: 3,
    metodologia: 'Taller participativo y práctico'
  },
  modulos: [], // { id, titulo, objetivo, sesiones: [] }
  guiaGenerada: null
};

// Pasos de Navegación
const steps = [
  { id: 1, label: '1. Datos Generales' },
  { id: 2, label: '2. Módulos y Temas' },
  { id: 3, label: '3. Generación de Guiones' },
  { id: 4, label: '4. Descarga y Exportación' }
];

function init(){
  actualizarEstadoConexion();
  renderStepsNav();
  render();
}

function actualizarEstadoConexion(){
  const dot = document.getElementById('apiDot');
  const txt = document.getElementById('apiStatusText');
  const badge = document.getElementById('modelBadge');
  
  if(state.configIA.apiKey){
    dot.className = 'dot ok';
    txt.textContent = 'IA Conectada (' + state.configIA.provider.toUpperCase() + ')';
    badge.textContent = state.configIA.model;
  } else {
    dot.className = 'dot';
    txt.textContent = 'Configurar API Key';
    badge.textContent = 'Sin clave';
  }
}

function abrirConfigIA(){
  document.getElementById('cfgProvider').value = state.configIA.provider;
  document.getElementById('cfgApiKey').value = state.configIA.apiKey;
  document.getElementById('cfgModel').value = state.configIA.model;
  document.getElementById('cfgBaseUrl').value = state.configIA.baseUrl;
  actualizarCamposProveedor();
  document.getElementById('modalConfigIA').style.display = 'flex';
}

function cerrarConfigIA(){
  document.getElementById('modalConfigIA').style.display = 'none';
}

function actualizarCamposProveedor(){
  const prov = document.getElementById('cfgProvider').value;
  const baseUrlGroup = document.getElementById('cfgBaseUrlGroup');
  const modelInput = document.getElementById('cfgModel');
  const hint = document.getElementById('cfgModelHint');

  if(prov === 'compatible'){
    baseUrlGroup.style.display = 'block';
    hint.textContent = 'Ejemplos: deepseek-chat, llama-3.1-70b-versatile';
    if(!modelInput.value || modelInput.value.includes('claude') || modelInput.value.includes('gpt')) modelInput.value = 'deepseek-chat';
  } else {
    baseUrlGroup.style.display = 'none';
    if(prov === 'anthropic'){
      hint.textContent = 'claude-3-5-sonnet-20241022, claude-3-haiku-20240307';
      if(!modelInput.value.includes('claude')) modelInput.value = 'claude-3-5-sonnet-20241022';
    } else if(prov === 'openai'){
      hint.textContent = 'gpt-4o, gpt-4o-mini';
      if(!modelInput.value.includes('gpt')) modelInput.value = 'gpt-4o';
    } else if(prov === 'gemini'){
      hint.textContent = 'gemini-1.5-pro, gemini-1.5-flash';
      if(!modelInput.value.includes('gemini')) modelInput.value = 'gemini-1.5-pro';
    }
  }
}

function guardarConfigIA(){
  state.configIA.provider = document.getElementById('cfgProvider').value;
  state.configIA.apiKey = document.getElementById('cfgApiKey').value.trim();
  state.configIA.model = document.getElementById('cfgModel').value.trim();
  state.configIA.baseUrl = document.getElementById('cfgBaseUrl').value.trim();

  localStorage.setItem('gm_ia_provider', state.configIA.provider);
  localStorage.setItem('gm_ia_key', state.configIA.apiKey);
  localStorage.setItem('gm_ia_model', state.configIA.model);
  localStorage.setItem('gm_ia_baseurl', state.configIA.baseUrl);

  actualizarEstadoConexion();
  cerrarConfigIA();
}

/**
 * Capa de Abstracción para Consultar Cualquier IA
 */
async function callIA(prompt, systemInstruction = "Eres un especialista en diseño curricular e instruccional pedagógico.") {
  if(!state.configIA.apiKey){
    abrirConfigIA();
    throw new Error("Por favor, ingresa tu API Key para continuar.");
  }

  const { provider, apiKey, model, baseUrl } = state.configIA;

  if (provider === 'anthropic') {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: model || 'claude-3-5-sonnet-20241022',
        max_tokens: 4000,
        system: systemInstruction,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if(!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'Error en Anthropic API');
    }
    const data = await response.json();
    return data.content[0].text;
  }

  if (provider === 'openai' || provider === 'compatible') {
    const url = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : `${baseUrl.replace(/\/$/, '')}/chat/completions`;
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model || (provider === 'openai' ? 'gpt-4o' : 'deepseek-chat'),
        messages: [
          { role: 'system', content: systemInstruction },
          { role: 'user', content: prompt }
        ],
        temperature: 0.7
      })
    });
    if(!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || `Error en ${provider.toUpperCase()} API`);
    }
    const data = await response.json();
    return data.choices[0].message.content;
  }

  if (provider === 'gemini') {
    const cleanModel = model || 'gemini-1.5-pro';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${apiKey}`;
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: systemInstruction }] },
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 4000 }
      })
    });
    if(!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'Error en Gemini API');
    }
    const data = await response.json();
    return data.candidates[0].content.parts[0].text;
  }

  throw new Error("Proveedor no soportado.");
}

function parseJsonFromAI(rawText) {
  let cleaned = rawText.trim();
  if (cleaned.startsWith("```")) {
    cleaned = cleaned.replace(/^```[a-z]*\n/i, "").replace(/```$/g, "").trim();
  }
  return JSON.parse(cleaned);
}

// Renderizado de la navegación por pasos
function renderStepsNav(){
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = '';
  steps.forEach(s => {
    const tab = document.createElement('div');
    tab.className = `step-tab ${state.step === s.id ? 'active' : ''} ${state.step > s.id ? 'done' : ''}`;
    tab.textContent = s.label;
    tab.onclick = () => {
      if(state.loading) return;
      if(s.id < state.step || (s.id === 2 && state.espacio.nombreEspacio) || (s.id === 3 && state.modulos.length) || (s.id === 4 && state.guiaGenerada)){
        state.step = s.id;
        render();
      }
    };
    nav.appendChild(tab);
  });
}

// VISTAS PASO A PASO
function render(){
  renderStepsNav();
  const content = document.getElementById('content');
  content.innerHTML = '';

  if(state.loading){
    content.innerHTML = `
      <div class="card" style="text-align:center; padding:50px 20px;">
        <div class="spinner" style="width:36px; height:36px; margin-bottom:16px;"></div>
        <h3 style="color:var(--azul-principal); margin-bottom:6px;">Procesando con ${state.configIA.provider.toUpperCase()} (${state.configIA.model})...</h3>
        <p style="color:#667085; font-size:14px;">${state.loadingMessage || 'El modelo está elaborando tu propuesta instruccional...'}</p>
      </div>
    `;
    return;
  }

  if(state.step === 1) renderPaso1(content);
  else if(state.step === 2) renderPaso2(content);
  else if(state.step === 3) renderPaso3(content);
  else if(state.step === 4) renderPaso4(content);
}

// Paso 1: Configuración del Espacio
function renderPaso1(container){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <h2>Paso 1: Información General del Proceso Formativo</h2>
    <div class="form-group">
      <label>Nombre del Espacio / Taller / Curso *</label>
      <input type="text" id="nombreEspacio" value="${escapeHtml(state.espacio.nombreEspacio)}" placeholder="Ej. Formación de Lideresas Comunitarias en Gobernanza Local">
    </div>
    <div class="form-group">
      <label>Objetivo General de Aprendizaje *</label>
      <textarea id="objetivoGeneral" rows="3" placeholder="Ej. Fortalecer capacidades metodológicas y prácticas para la incidencia en políticas públicas...">${escapeHtml(state.espacio.objetivoGeneral)}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Público Meta / Participantes</label>
        <input type="text" id="publicoMeta" value="${escapeHtml(state.espacio.publicoMeta)}" placeholder="Ej. Mujeres lideresas comunitarias y jóvenes rurales">
      </div>
      <div class="form-group">
        <label>Enfoque Metodológico</label>
        <input type="text" id="metodologia" value="${escapeHtml(state.espacio.metodologia)}" placeholder="Ej. Educación popular, enfoque de derechos y género">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Duración Total Estimada (Horas)</label>
        <input type="text" id="duracionHoras" value="${state.espacio.duracionHoras}">
      </div>
      <div class="form-group">
        <label>Cantidad de Módulos Sugeridos</label>
        <input type="number" id="cantidadModulos" min="1" max="8" value="${state.espacio.cantidadModulos}">
      </div>
    </div>
    <div class="acciones">
      <div></div>
      <button class="btn btn-accent" onclick="generarEstructuraModulos()">Siguiente: Generar Módulos con IA →</button>
    </div>
  `;
  container.appendChild(el);
}

async function generarEstructuraModulos(){
  const nombre = document.getElementById('nombreEspacio').value.trim();
  const obj = document.getElementById('objetivoGeneral').value.trim();
  if(!nombre || !obj){
    alert('Por favor, completa el nombre del espacio y el objetivo general.');
    return;
  }
  state.espacio.nombreEspacio = nombre;
  state.espacio.objetivoGeneral = obj;
  state.espacio.publicoMeta = document.getElementById('publicoMeta').value.trim();
  state.espacio.metodologia = document.getElementById('metodologia').value.trim();
  state.espacio.duracionHoras = document.getElementById('duracionHoras').value.trim();
  state.espacio.cantidadModulos = parseInt(document.getElementById('cantidadModulos').value) || 3;

  state.loading = true;
  state.loadingMessage = 'Diseñando la arquitectura temática y dosificación de módulos...';
  render();

  const prompt = `Actúa como diseñador curricular experto. Diseña una estructura modular para el siguiente proceso formativo:
Nombre: "${state.espacio.nombreEspacio}"
Objetivo General: "${state.espacio.objetivoGeneral}"
Público Meta: "${state.espacio.publicoMeta}"
Metodología: "${state.espacio.metodologia}"
Duración Total: ${state.espacio.duracionHoras} horas
Cantidad de Módulos requerida: ${state.espacio.cantidadModulos}

Debes responder ÚNICAMENTE con un objeto JSON válido (sin explicaciones adicionales ni texto antes o después) con la siguiente estructura:
{
  "modulos": [
    {
      "id": 1,
      "titulo": "Título del Módulo",
      "objetivo": "Objetivo específico de este módulo",
      "duracion": "4 horas",
      "temas": ["Tema 1", "Tema 2", "Tema 3"]
    }
  ]
}`;

  try{
    const raw = await callIA(prompt);
    const parsed = parseJsonFromAI(raw);
    state.modulos = parsed.modulos || [];
    state.step = 2;
  }catch(e){
    alert('Error al generar estructura: ' + e.message);
  }finally{
    state.loading = false;
    render();
  }
}

// Paso 2: Revisión de Módulos
function renderPaso2(container){
  const el = document.createElement('div');
  el.className = 'card';
  
  let modulosHtml = state.modulos.map((m, idx) => `
    <div style="border:1px solid #E2E8F0; border-radius:8px; padding:14px; margin-bottom:12px; background:#FAFAFA;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-weight:700; color:var(--azul-secundario);">Módulo ${idx+1}</span>

  render();

  const prompt = `Actúa como especialista pedagógico en capacitación y educación de adultos. A partir del siguiente diseño, genera la GUÍA METODOLÓGICA detallada:
Espacio: "${state.espacio.nombreEspacio}"
Objetivo General: "${state.espacio.objetivoGeneral}"
Público Meta: "${state.espacio.publicoMeta}"
Metodología: "${state.espacio.metodologia}"
Duración Total: ${state.espacio.duracionHoras}

Módulos:
${JSON.stringify(state.modulos, null, 2)}

Para CADA módulo, desglosa la sesión en momentos didácticos estructurados con exactitud.
Responde ÚNICAMENTE con un JSON válido con esta estructura:
{
  "resumenEspacio": {
    "nombre": "${state.espacio.nombreEspacio}",
    "horas": "${state.espacio.duracionHoras}",
    "enfoque": "${state.espacio.metodologia}"

          "tecnica": "Nombre de la técnica participativa",
          "recursos": "Materiales requeridos",

        },

// Generación y descarga Word (.doc)
function descargarWord(){
  if(!state.guiaGenerada) return;
  const nombreLimpio = (state.espacio.nombreEspacio || 'Guia_Metodologica').replace(/[^a-z0-9áéíóúñ]+/gi,'_');

  let bodyTables = (state.guiaGenerada.guiones || []).map((g, idx) => `

    </h3>
    <p><b>Objetivo Específico:</b> ${escapeHtml(g.objetivo)}</p>
    <table border="1" cellpadding="6" cellspacing="0" style="width:100%; border-collapse:collapse; font-size:10pt; font-family:Arial,sans-serif;">
      <tr style="background:#02244F; color:#FFFFFF; font-weight:bold;">
        <th style="width:15%;">Fase</th>
        <th style="width:10%;">Tiempo</th>
        <th style="width:35%;">Actividad y Secuencia</th>
        <th style="width:20%;">Técnica y Recursos</th>
        <th style="width:20%;">Producto Esperado</th>
      </tr>
      ${(g.momentos || []).map(m => `
        <tr>
          <td><b>${escapeHtml(m.fase)}</b></td>
          <td align="center">${escapeHtml(m.tiempoMin ? m.tiempoMin + ' min' : '')}</td>
          <td>${escapeHtml(m.actividad)}</td>
          <td><b>${escapeHtml(m.tecnica)}</b><br><span style="font-size:9pt; color:#444;">${escapeHtml(m.recursos)}</span></td>
          <td>${escapeHtml(m.productoEsperado)}</td>
        </tr>
      `).join('')}
    </table>
  `).join('');

  const contenido = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='[http://www.w3.org/TR/REC-html40](http://www.w3.org/TR/REC-html40)'>
    <head><meta charset='utf-8'><title>${escapeHtml(state.espacio.nombreEspacio)}</title>
    <style>
      body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20mm; font-size: 11pt; color: #1B2530; }
      h1 { color: #02244F; font-size: 20pt; text-align: center; }
      h2 { color: #F05A12; font-size: 14pt; text-align: center; margin-bottom: 24pt; }
    </style>
    </head>
    <body>
      <h1>GUÍA METODOLÓGICA DE FORMACIÓN</h1>
      <h2>${escapeHtml(state.espacio.nombreEspacio)}</h2>
      
      <table border="1" cellpadding="6" cellspacing="0" style="width:100%; border-collapse:collapse; margin-bottom:20pt; font-size:10pt;">
        <tr><td style="background:#F4F6F9; font-weight:bold; width:25%;">Objetivo General:</td><td colspan="3">${escapeHtml(state.espacio.objetivoGeneral)}</td></tr>

      </table>

      ${bodyTables}

    </html>
  `;

  const blob = new Blob(['\ufeff', contenido], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.download = `Guia_Metodologica_${nombreLimpio}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

// Generación de PDF
async function descargarPDF(btnEl){
  const originalText = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = 'Procesando PDF...';

  const hiddenContainer = document.getElementById('pdfExportContainer');
  hiddenContainer.style.display = 'block';

  try {
    const { jsPDF } = window.jspdf;
    const canvas = await html2canvas(hiddenContainer, {
      scale: 2,
      useCORS: true,
      logging: false
    });

    hiddenContainer.style.display = 'none';

    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = 210;
    const pageHeight = 297;
    const margin = 10;
    const printWidth = pageWidth - (margin * 2);
    const pxPerMM = canvas.width / printWidth;
    const pageHeightPx = (pageHeight - (margin * 2)) * pxPerMM;

    let renderedPx = 0;
    let firstPage = true;

    while (renderedPx < canvas.height) {
      const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = sliceHeightPx;
      const sliceCtx = sliceCanvas.getContext('2d');

      sliceCtx.drawImage(
        canvas,
        0, renderedPx, canvas.width, sliceHeightPx,
        0, 0, canvas.width, sliceHeightPx
      );

      const sliceData = sliceCanvas.toDataURL('image/png');
      const sliceHeightMM = sliceHeightPx / pxPerMM;

      if (!firstPage) {
        pdf.addPage();
      } else {
        firstPage = false;
      }

      pdf.addImage(sliceData, 'PNG', margin, margin, printWidth, sliceHeightMM);
      renderedPx += sliceHeightPx;
    }

    const nombreLimpio = (state.espacio.nombreEspacio || 'guia_metodologica').replace(/[^a-z0-9áéíóúñ]+/gi,'_');
    pdf.save(`Guia_Metodologica_${nombreLimpio}.pdf`);

  } catch(e) {
    alert('Error al generar PDF: ' + e.message);
    hiddenContainer.style.display = 'none';
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = originalText;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
